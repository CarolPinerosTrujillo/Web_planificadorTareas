<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlannerApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Titan+One&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/styles.css">
</head>


<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="#">Planifica tus tareas</a>
            <div class="navbar-reloj">
                <span id="fechaActual"></span>
                <span id="horaActual"></span>
            </div>
        </div>
    </nav>

    <!-- HEADER -->
    <header class="header-main">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="titulo-app">Carol PlannerApp</h1>
            <img src="img/planificador.png" class="logo-header">
        </div>
    </header>

    <!-- CONTENIDO -->
    <div class="container mt-4">
        <div class="row">

            <!-- FORMULARIO -->
            <div class="col-12 col-lg-4">
                <div class="card form-card shadow-lg border-0 p-4">

                    <form id="formularioTareas" action="#" method="POST">

                        <h3 class="mb-4 titulo-formulario">
                            Planea tu día
                        </h3>

                        <!-- Nombre -->
                        <label for="nombreTarea" class="form-label">
                            Nombre de la tarea
                        </label>

                        <div class="input-group mb-3">
                            <span class="input-group-text icon-box">
                                <img src="img/nombre.png" alt="Nombre" class="input-icon">
                            </span>

                            <input type="text" class="form-control" id="nombreTarea" placeholder="Nombre">
                        </div>

                        <!-- Descripción -->
                        <label for="descripcionTarea" class="form-label">
                            Descripción
                        </label>

                        <div class="input-group mb-3">
                            <span class="input-group-text icon-box">
                                <img src="img/descrip.png" alt="Descripción" class="input-icon">
                            </span>

                            <input type="text" class="form-control" id="descripcionTarea" placeholder="Descripción">
                        </div>

                        <!-- Categoría -->
                        <label for="categoriaTarea" class="form-label">
                            Categoría
                        </label>

                        <div class="input-group mb-3">
                            <span class="input-group-text icon-box">
                                <img src="img/cat.png" alt="Categoría" class="input-icon">
                            </span>

                            <select class="form-select" id="categoriaTarea">

                                <option value="" disabled selected>
                                    Categoría
                                </option>

                                <option>Casa</option>
                                <option>Trabajo</option>
                                <option>Estudio</option>
                                <option>Personal</option>
                                <option>Compras</option>
                                <option>Finanzas</option>
                                <option>Ejercicio</option>


                            </select>
                        </div>

                        <!-- Fecha -->
                        <label for="fechaTarea" class="form-label">
                            Fecha
                        </label>

                        <div class="input-group mb-3">
                            <span class="input-group-text icon-box">
                                <img src="img/fecha.png" alt="Fecha" class="input-icon">
                            </span>

                            <input type="date" class="form-control" id="fechaTarea">
                        </div>

                        <!-- Hora -->
                        <label for="horaTarea" class="form-label">
                            Hora
                        </label>

                        <div class="input-group mb-3">
                            <span class="input-group-text icon-box">
                                <img src="img/hora.png" alt="Hora" class="input-icon">
                            </span>

                            <input type="time" class="form-control" id="horaTarea">
                        </div>

                        <!-- Prioridad -->
                        <label for="prioridadTarea" class="form-label">
                            Prioridad
                        </label>

                        <div class="input-group mb-3">
                            <span class="input-group-text icon-box">
                                <img src="img/prioridad.png" alt="Prioridad" class="input-icon">
                            </span>

                            <select class="form-select" id="prioridadTarea">

                                <option value="" disabled selected>
                                    Prioridad
                                </option>

                                <option>Baja</option>
                                <option>Media</option>
                                <option>Alta</option>

                            </select>
                        </div>

                        <div id="mensajeError" class="alert alert-danger d-none" role="alert">

                            Debes completar todos los campos.

                        </div>

                        <button type="submit" class="btn btn-gradient w-100" id="btnAgregarTarea">

                            Agregar tarea

                        </button>

                        <button type="button" class="btn btn-sm btn-outline-secondary mt-2 w-100 d-none" onclick="ejecutarPruebas()">
                            Ejecutar pruebas
                        </button>

                    </form>

                </div>
            </div>

            <!-- LISTADO -->
            <div class="col-12 col-lg-8">

                <!-- Barra de filtros -->
                <div class="filter-bar mb-4">
                    <button class="btn filtro active" data-status="TODAS">Ver todo</button>
                    <button class="btn filtro" data-status="PORHACER">Por hacer</button>
                    <button class="btn filtro" data-status="ENPROCESO">En proceso</button>
                    <button class="btn filtro" data-status="COMPLETADA">Terminadas</button>

                </div>

                <!-- Columnas -->
                <div id="listaTareas" class="row g-4">
                    <div class="col-12 col-md-6 col-xl-4">
                        <h5 class="estado-title pendiente">Por hacer</h5>
                        <div id="listaPorHacer" class="lista-estado"></div>
                    </div>

                    <div class="col-12 col-md-6 col-xl-4">
                        <h5 class="estado-title proceso">En proceso</h5>
                        <div id="listaProceso" class="lista-estado"></div>
                    </div>

                    <div class="col-12 col-md-6 col-xl-4">
                        <h5 class="estado-title terminado">Terminadas</h5>
                        <div id="listaTerminadas" class="lista-estado"></div>
                    </div>


                </div>

            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer-main">
        <div class="container text-center">
            <p class="footer-texto">Carol PlannerApp &copy; 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./JS/taskManager.js"></script>
    <script src="./JS/tests.js"></script>
    <script src="./JS/index.js"></script>

</body>

</html>
